<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOBERANO — Assistente de IA</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --user-msg-bg: #1d4ed8;
      --assistant-msg-bg: #1e293b;
      --error: #ef4444;
      --border: #475569;
      --radius: 8px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-secondary);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
    }

    header .status {
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    header .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }

    header .status .dot.offline {
      background: var(--error);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #chat-container::-webkit-scrollbar {
      width: 6px;
    }

    #chat-container::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    #chat-container::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 3px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-msg-bg);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-msg-bg);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .message.assistant.streaming {
      border-color: var(--accent);
    }

    .message.error {
      align-self: flex-start;
      background: rgba(239, 68, 68, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }

    .typing-indicator {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: 16px;
      align-items: center;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      30% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    #input-container {
      background: var(--bg-secondary);
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.875rem;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }

    #message-input:focus {
      border-color: var(--accent);
    }

    #message-input::placeholder {
      color: var(--text-secondary);
    }

    #send-button {
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius);
      padding: 12px 24px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
      min-height: 44px;
    }

    #send-button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    #send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #session-info {
      font-size: 0.7rem;
      color: var(--text-secondary);
      padding: 4px 24px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ SOBERANO</h1>
    <span class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Conectando...</span>
    </span>
  </header>

  <div id="chat-container"></div>

  <div id="input-container">
    <textarea
      id="message-input"
      placeholder="Digite sua mensagem para o SOBERANO..."
      rows="1"
    ></textarea>
    <button id="send-button" disabled>Enviar</button>
  </div>

  <div id="session-info">
    <span id="session-id-label">Carregando...</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
